
# YATO Platform - Docker Compose Configuration
# Services: Database, Cache, API, Frontend, Proxy, Vault

services:

  # ==========================================================================
  # DATABASE SERVICE
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    restart: always
    container_name: yato-postgres
    labels:
      yato.service: "database"
      yato.layer: "infrastructure"
    environment:
      POSTGRES_USER: ${DB_USER:-yato}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yatopass}
      POSTGRES_DB: ${DB_DATABASE:-yato}
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${HOST_POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-yato}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yato-internal

  # ==========================================================================
  # DOCKER PROXY SERVICE (read-only Docker socket access)
  # ==========================================================================
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    restart: always
    container_name: yato-docker-proxy
    labels:
      yato.service: "docker-proxy"
      yato.layer: "infrastructure"
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${HOST_DOCKER_PROXY_PORT:-2375}:2375"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2375"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yato-internal

  # ==========================================================================
  # CACHE SERVICE
  # ==========================================================================
  redis:
    image: redis:7-alpine
    restart: always
    container_name: yato-redis
    labels:
      yato.service: "cache"
      yato.layer: "infrastructure"
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${HOST_REDIS_PORT:-6380}:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yato-internal

  # ==========================================================================
  # API SERVICE (Backend)
  # ==========================================================================
  yato-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    container_name: yato-backend
    labels:
      yato.service: "api"
      yato.layer: "application"
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-yato}:${DB_PASSWORD:-yatopass}@postgres:5432/${DB_DATABASE:-yato}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      NODE_OPTIONS: "--max-old-space-size=512"
      DOCKER_HOST_URL: "http://docker-proxy:2375"
      TZ: ${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .env:/app/.env
    ports:
      - "127.0.0.1:${HOST_BACKEND_PORT:-4000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/system/config/branding').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - yato-internal

  # ==========================================================================
  # FRONTEND SERVICE (Web Portal)
  # ==========================================================================
  yato-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    container_name: yato-frontend
    labels:
      yato.service: "frontend"
      yato.layer: "application"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${HOST_NGINX_HTTP_PORT:-9090}/api}
      TZ: ${TZ:-UTC}
    depends_on:
      yato-backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOST_FRONTEND_PORT:-4001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - yato-internal

  # ==========================================================================
  # PROXY SERVICE (Nginx Reverse Proxy)
  # ==========================================================================
  nginx:
    image: nginx:alpine
    restart: always
    container_name: yato-nginx
    labels:
      yato.service: "proxy"
      yato.layer: "gateway"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HOST_NGINX_HTTP_PORT:-9090}:80"
      - "${HOST_NGINX_HTTPS_PORT:-9443}:443"
    depends_on:
      yato-frontend:
        condition: service_healthy
      yato-backend:
        condition: service_healthy
    networks:
      - yato-internal

  # ==========================================================================
  # VAULT SERVICE (Password Manager)
  # ==========================================================================
  vaultwarden:
    image: vaultwarden/server:latest
    restart: always
    container_name: yato-vaultwarden
    labels:
      yato.service: "vault"
      yato.layer: "security"
    environment:
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: "false"
      TZ: ${TZ:-UTC}
    volumes:
      - vaultwarden_data:/data
    ports:
      - "127.0.0.1:${HOST_VAULTWARDEN_PORT:-8085}:80"
    networks:
      - yato-internal

networks:
  yato-internal:
    driver: bridge

volumes:
  postgres_data:
  vaultwarden_data:
